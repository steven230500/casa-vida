services:
  casavida-app:
    image: ghcr.io/steven230500/casa-vida:latest
    container_name: casavida-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - DATABASE_URL=postgres://casavida:${POSTGRES_PASSWORD}@casavida-db:5432/casavida
    networks:
      - infra_infra_network
      - casavida_internal
    depends_on:
      casavida-db:
        condition: service_healthy

  casavida-db:
    image: postgres:16-alpine
    container_name: casavida-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=casavida
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=casavida
    volumes:
      - casavida_pgdata:/var/lib/postgresql/data
    networks:
      - casavida_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casavida"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  infra_infra_network:
    external: true
  casavida_internal:

volumes:
  casavida_pgdata:
